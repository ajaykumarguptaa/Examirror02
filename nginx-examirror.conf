# /etc/nginx/sites-available/examirror.in

server {
    listen 80;
    listen [::]:80;
    server_name examirror.in www.examirror.in;

    # Maximum file upload size for student photos, stamps, PDFs
    client_max_body_size 50M;

    # Frontend Single Page Application (SPA)
    root /var/www/Examirror02/frontend/dist;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SPA routing - redirect non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Node.js / Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static uploads persistence (photos, stamps, documents)
    location /uploads/ {
        alias /var/www/Examirror02/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
